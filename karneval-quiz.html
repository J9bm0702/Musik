<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karneval-Quiz – Die Bühnen-Challenge</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d0a1f;
    --bg2:#181040;
    --panel:#1d1545;
    --panel2:#251a58;
    --line:#5b3fd4;
    --neon:#9d6bff;
    --cyan:#3de8ff;
    --gold:#ffc83d;
    --pink:#ff4fa0;
    --green:#3ecf8e;
    --red:#ff5a6e;
    --text:#f3eeff;
    --muted:#a99cd6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Nunito',sans-serif;
    color:var(--text);
    min-height:100vh;
    background:
      radial-gradient(ellipse 60% 40% at 20% -5%, rgba(157,107,255,.25), transparent 60%),
      radial-gradient(ellipse 50% 35% at 85% 0%, rgba(61,232,255,.18), transparent 60%),
      var(--bg);
    overflow-x:hidden;
  }
  /* Scheinwerfer-Kegel im Hintergrund */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      conic-gradient(from 200deg at 15% -10%, transparent 0 8deg, rgba(255,200,61,.06) 8deg 16deg, transparent 16deg),
      conic-gradient(from 150deg at 85% -10%, transparent 0 8deg, rgba(61,232,255,.06) 8deg 16deg, transparent 16deg);
  }
  header{position:relative;z-index:1;text-align:center;padding:26px 14px 10px}
  h1{
    font-family:'Baloo 2',cursive;font-size:clamp(1.7rem,5vw,2.7rem);font-weight:800;
    background:linear-gradient(90deg,var(--gold),var(--pink) 55%,var(--cyan));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 14px rgba(157,107,255,.45));
    letter-spacing:.5px;
  }
  .subtitle{color:var(--muted);font-weight:800;font-size:.92rem;margin-top:2px;letter-spacing:2px;text-transform:uppercase}

  .stage{position:relative;z-index:1;max-width:700px;margin:18px auto 30px;padding:0 14px}
  .card{
    background:linear-gradient(180deg,var(--panel2),var(--panel));
    border:1px solid var(--line);
    border-radius:22px;
    padding:26px 22px;
    box-shadow:0 0 0 1px rgba(157,107,255,.15), 0 0 40px rgba(91,63,212,.35), 0 20px 50px rgba(0,0,0,.55);
    animation:pop .35s ease;
  }
  @keyframes pop{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  /* HUD */
  .hud{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
  .badge{
    font-family:'Baloo 2',cursive;font-weight:700;font-size:.92rem;
    background:rgba(13,10,31,.7);border:1px solid var(--line);
    color:var(--cyan);padding:6px 13px;border-radius:999px;
  }
  .badge.score{color:var(--gold)}
  .badge.fire{color:#fff;background:linear-gradient(90deg,#ff7b2e,var(--pink));border-color:transparent;
    box-shadow:0 0 14px rgba(255,79,160,.6);animation:pulse 1s infinite alternate}
  @keyframes pulse{to{transform:scale(1.06)}}
  .mascot{margin-left:auto;font-size:2rem;filter:drop-shadow(0 0 8px rgba(255,200,61,.5))}

  .progress{height:12px;background:rgba(13,10,31,.8);border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-bottom:18px}
  .progress>div{height:100%;background:linear-gradient(90deg,var(--cyan),var(--neon),var(--pink));width:0;transition:width .35s;box-shadow:0 0 12px var(--neon)}

  .qtext{
    font-family:'Baloo 2',cursive;font-weight:700;
    font-size:clamp(1.15rem,3.4vw,1.5rem);
    margin:4px 0 18px;line-height:1.35;
  }

  /* Buttons */
  .btn{
    display:block;width:100%;text-align:left;
    font-family:'Nunito',sans-serif;font-weight:800;font-size:1.04rem;
    background:rgba(13,10,31,.55);color:var(--text);
    border:2px solid var(--line);border-radius:14px;
    padding:14px 16px;margin:10px 0;cursor:pointer;
    transition:transform .08s, box-shadow .15s, border-color .15s;
  }
  .btn:hover{transform:translateY(-2px);border-color:var(--neon);box-shadow:0 0 14px rgba(157,107,255,.45)}
  .btn:active{transform:translateY(1px)}
  .btn:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
  .btn.correct{background:rgba(62,207,142,.18);border-color:var(--green);box-shadow:0 0 16px rgba(62,207,142,.5);color:#c8ffe6}
  .btn.wrong{background:rgba(255,90,110,.18);border-color:var(--red);box-shadow:0 0 16px rgba(255,90,110,.5);color:#ffd3d9}
  .btn.dim{opacity:.35;pointer-events:none}
  .btn.selected{border-color:var(--cyan);box-shadow:0 0 16px rgba(61,232,255,.55);background:rgba(61,232,255,.12)}

  .btn-primary{
    display:inline-block;width:auto;text-align:center;
    font-family:'Baloo 2',cursive;font-size:1.18rem;font-weight:800;
    color:#1d1100;background:linear-gradient(90deg,var(--gold),#ffa53d);
    border:none;border-radius:999px;padding:14px 36px;cursor:pointer;
    box-shadow:0 0 22px rgba(255,200,61,.5), 0 5px 0 #b97f12;
  }
  .btn-primary:active{transform:translateY(3px);box-shadow:0 0 22px rgba(255,200,61,.5)}
  .btn-primary:disabled{opacity:.5;cursor:not-allowed}
  .btn-primary:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}

  .feedback{margin-top:14px;padding:12px 14px;border-radius:14px;font-weight:800;display:none;line-height:1.45}
  .feedback.ok{display:block;background:rgba(62,207,142,.14);color:#bcffdf;border:1px solid var(--green)}
  .feedback.no{display:block;background:rgba(255,90,110,.14);color:#ffd0d6;border:1px solid var(--red)}
  .feedback .big{font-family:'Baloo 2',cursive;font-size:1.22rem}
  .feedback b{color:var(--gold)}

  /* Matching */
  .match-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .match-grid .btn{margin:0;font-size:.96rem;min-height:58px}

  /* Schreiben */
  .write-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  input[type=text]{
    flex:1;min-width:220px;
    font-family:'Nunito',sans-serif;font-weight:800;font-size:1.15rem;
    padding:13px 14px;border-radius:14px;
    border:2px solid var(--line);background:rgba(13,10,31,.7);color:var(--text);
  }
  input[type=text]::placeholder{color:#6d5fa6}
  input[type=text]:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 14px rgba(61,232,255,.45)}
  .charkeys{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
  .charkeys button{
    font-size:1.05rem;font-weight:800;padding:8px 14px;border-radius:10px;cursor:pointer;
    border:2px solid var(--line);background:rgba(13,10,31,.6);color:var(--cyan);
  }
  .charkeys button:hover{border-color:var(--cyan)}
  .hint{font-size:.86rem;color:var(--muted);margin-top:8px;font-weight:700}

  /* Levelübersicht */
  .levels{display:grid;gap:10px;margin:18px 0}
  .level-chip{
    display:flex;align-items:center;gap:14px;
    background:rgba(13,10,31,.55);border:1px solid var(--line);border-radius:16px;
    padding:12px 16px;font-weight:800;
  }
  .level-chip .medal{font-size:1.8rem;filter:drop-shadow(0 0 8px rgba(255,200,61,.45))}
  .level-chip small{display:block;font-weight:700;color:var(--muted)}
  .level-chip .count{margin-left:auto;font-family:'Baloo 2';color:var(--cyan);white-space:nowrap}

  table.scores{width:100%;border-collapse:collapse;margin-top:10px}
  table.scores td,table.scores th{padding:8px 6px;text-align:left;border-bottom:1px solid rgba(91,63,212,.4);font-weight:800}
  table.scores th{font-family:'Baloo 2',cursive;color:var(--pink)}
  table.scores td.pts{text-align:right;color:var(--gold)}
  table.scores tr.me td{color:var(--cyan)}

  .center{text-align:center}
  .big-score{
    font-family:'Baloo 2',cursive;font-size:3.4rem;line-height:1.1;
    background:linear-gradient(90deg,var(--gold),var(--pink));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 18px rgba(255,200,61,.45));
  }
  .stats-row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:16px 0}
  .stat{
    background:rgba(13,10,31,.6);border:1px solid var(--line);border-radius:14px;
    padding:10px 18px;text-align:center;
  }
  .stat .v{font-family:'Baloo 2';font-size:1.5rem;color:var(--cyan)}
  .stat .l{font-size:.78rem;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:1px}
  .spot{
    width:120px;height:120px;margin:0 auto 6px;border-radius:50%;
    background:radial-gradient(circle, rgba(255,246,210,.25) 0%, transparent 70%);
    display:flex;align-items:center;justify-content:center;font-size:3.6rem;
  }
  .trash{
    margin:14px auto 4px;max-width:480px;
    background:rgba(255,79,160,.1);border:1px dashed var(--pink);border-radius:14px;
    padding:14px 16px;font-weight:800;line-height:1.5;color:#ffd9ec;
  }

  .confetti{position:fixed;top:-12px;width:11px;height:17px;z-index:50;pointer-events:none;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

  footer{position:relative;z-index:1;text-align:center;padding:16px;font-size:.8rem;color:var(--muted)}
</style>
</head>
<body>

<header>
  <h1>🎪 KARNEVAL-QUIZ 🎵</h1>
  <div class="subtitle">Die Bühnen-Challenge · Musik 5 · KA 2</div>
</header>

<main class="stage">
  <div class="card" id="screen"></div>
</main>
<footer>Karneval der Tiere · Dynamik · Cello · 6K United — viel Erfolg bei der KA! 🍀</footer>

<script>
"use strict";
/* =========================================================
   FRAGENKATALOG
========================================================= */
const MC_POOL = [

 {q:"Statt der Glasharmonika kann auch gespielt werden:",a:"Das Glockenspiel",w:["Die Trompete","Das Schlagzeug","Die Orgel"],e:"Glasharmonika oder ersatzweise Glockenspiel."},
 {q:"Welches Tier ist ruhig, magisch und schön?",a:"Der Schwan",w:["Der Löwe","Der Elefant","Die Hühner"],e:"Der Schwan: ruhig, magisch, schön."},
 {q:"Welche Eigenschaften passen zum Löwen?",a:"stolz, mächtig, mutig",w:["plump und schwerfällig","aufgeregt und hektisch","schnell und hüpfend"],e:"Der Löwe ist stolz, mächtig, laut und mutig."},
 {q:"Von wem stammt die Melodie zu „Ode an die Freude“?",a:"Ludwig van Beethoven",w:["Camille Saint-Saëns","Mark Forster","Wolfgang A. Mozart"],e:"Die Melodie stammt aus Beethovens 9. Sinfonie."},
 {q:"„Du, du liegst mir am Herzen“ ist ein …",a:"deutsches Volkslied",w:["Rap-Song","Opernstück","Weihnachtslied"],e:"Es ist ein altes deutsches Volkslied."},

const MATCH_SETS = [
 {title:"Ordne die Zeichen ihrer Bedeutung zu!",pairs:[
   ["pp","sehr leise"],["p","leise"],["mf","halblaut"],["f","laut"],["ff","sehr laut"],["<","lauter werden"]]},
 {title:"Ordne die Fachbegriffe der deutschen Übersetzung zu!",pairs:[
   ["pianissimo","sehr leise"],["mezzoforte","halblaut"],["forte","laut"],["fortissimo","sehr laut"],["crescendo","lauter werden"],["decrescendo","leiser werden"]]},
 {title:"Welche Eigenschaften gehören zu welchem Tier?",pairs:[
   ["🦁 Löwe","stolz & mächtig"],["🐘 Elefant","plump & schwerfällig"],["🐔 Hühner","aufgeregt & hektisch"],["🦘 Känguru","schnell & hüpfend"],["🦢 Schwan","ruhig & magisch"]]},
 {title:"Cello-Bauteile: Was gehört zusammen?",pairs:[
   ["Schnecke","verziertes Ende ganz oben"],["Wirbelkasten","hier wird das Cello gestimmt"],["Griffbrett","hier drücken die Finger die Saiten"],["Steg","hält die Saiten über dem Korpus hoch"],["F-Loch","Schallloch im Korpus"],["Stachel","darauf steht das Cello"]]},
 {title:"„Der Schwan“ & Spielweisen: Was gehört zusammen?",pairs:[
   ["Der Schwan","Cello"],["Die Wellen","Klavier"],["Zupfen","Pizzicato"],["Streichen mit Bogen","Arco"],["Alle Instrumente zusammen","Finale"]]}
];

const WRITE_POOL = [
 {q:"Wie heißt der Komponist von „Karneval der Tiere“? (Vor- und Nachname!)",a:"Camille Saint-Saëns",hint:"Der Nachname hat einen Bindestrich und ein ë."},
 {q:"Wie heißt das Cello mit vollem Namen?",a:"Violoncello",hint:"Beginnt wie „Violine“ …"},
 {q:"Das Zupfen der Saiten heißt mit Fachbegriff:",a:"Pizzicato",hint:"Italienisches Wort, beginnt mit P – Doppel-z!"},
 {q:"Das Streichen mit dem Bogen heißt mit Fachbegriff:",a:"Arco",hint:"Kurzes italienisches Wort."},
 {q:"pp ist die Abkürzung für:",a:"pianissimo",hint:"Bedeutet „sehr leise“ – Doppel-s!"},
 {q:"f ist die Abkürzung für:",a:"forte",hint:"Bedeutet „laut“."},
 {q:"ff ist die Abkürzung für:",a:"fortissimo",hint:"Bedeutet „sehr laut“ – Doppel-s!"},
 {q:"mf ist die Abkürzung für:",a:"mezzoforte",hint:"Bedeutet „halblaut“ – mit doppeltem z."},
 {q:"„Lauter werden“ heißt mit Fachbegriff:",a:"crescendo",hint:"Zeichen: < … beginnt mit c!"},
 {q:"„Leiser werden“ heißt mit Fachbegriff:",a:"decrescendo",hint:"Zeichen: > … wie crescendo, nur mit de- davor."},
 {q:"Musik, die etwas Außermusikalisches darstellt, nennt man:",a:"Programmmusik",hint:"Achtung: Das Wort hat DREI m hintereinander!"},
 {q:"Das verzierte Ende ganz oben am Cello heißt:",a:"Schnecke",hint:"Ein Tier ist auch so langsam …"},
 {q:"Der Kasten unter der Schnecke, in dem gestimmt wird, heißt:",a:"Wirbelkasten",hint:"Zusammengesetzt: Wirbel + Kasten."},
 {q:"Der Metallstab, auf dem das Cello steht, heißt:",a:"Stachel",hint:"Ein Igel hat viele davon."},
 {q:"Das Brett, auf das die Finger die Saiten drücken, heißt:",a:"Griffbrett",hint:"Zusammengesetzt: greifen + Brett."},
 {q:"Das kleine Holzteil, das die Saiten über dem Korpus hochhält:",a:"Steg",hint:"Gibt es auch über einem Bach …"},
 {q:"Das tiefste Streichinstrument im Orchester des Werks heißt:",a:"Kontrabass",hint:"Kontra + … – mit Doppel-s!"},
 {q:"Das letzte Stück, in dem alle Instrumente spielen, heißt:",a:"Finale",hint:"Wie beim Fußball-Turnier!"},
 {q:"Das Klapper-Instrument bei den Fossilien heißt:",a:"Xylophon",hint:"Beginnt mit X und endet mit -phon."},
 {q:"Das geheimnisvolle Glas-Instrument im Orchester heißt:",a:"Glasharmonika",hint:"Glas + … klingt wie Harmonie."}
];

/* Rundenumfang */
const N_MC = 10, N_SETS = 4, N_WR = 10;
const PASS = 0.7;

/* =========================================================
   SPIELZUSTAND & HIGHSCORE
========================================================= */
let state = {};
function resetState(){
  state = {name:"", score:0, streak:0, bestStreak:0,
           mc:[], mcIdx:0, mcCorrect:0,
           sets:[], setIdx:0, pairTotal:0, pairFirstTry:0,
           wr:[], wrIdx:0, wrCorrect:0};
}
function bumpStreak(){ state.streak++; if(state.streak>state.bestStreak) state.bestStreak=state.streak; }

let memScores = [];
function loadScores(){
  try{ const s = localStorage.getItem("kdtScores"); if(s) return JSON.parse(s); }catch(e){}
  return memScores;
}
function saveScores(list){
  memScores = list;
  try{ localStorage.setItem("kdtScores", JSON.stringify(list)); }catch(e){}
}
function personalBest(name){
  return loadScores().filter(s=>s.n===name).reduce((m,s)=>Math.max(m,s.p),0);
}
function addScore(name,pts){
  const list = loadScores();
  list.push({n:name||"Spieler", p:pts, d:new Date().toLocaleDateString("de-DE")});
  list.sort((a,b)=>b.p-a.p);
  saveScores(list.slice(0,5));
}

/* =========================================================
   HILFSFUNKTIONEN
========================================================= */
const screen = document.getElementById("screen");
const shuffle = a => a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function levenshtein(a,b){
  a=a.toLowerCase(); b=b.toLowerCase();
  const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);
  for(let j=1;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[m][n];
}
function comboBonus(){ return state.streak>=3 ? 5 : 0; }

function hud(title, progress){
  return `<div class="hud">
    <span class="badge">${title}</span>
    <span class="badge score">⭐ ${state.score}</span>
    <span class="badge ${state.streak>=3?"fire":""}">🔥 Serie ${state.streak} · Rekord ${state.bestStreak}</span>
    <span class="mascot" id="mascot">🦁</span>
  </div>
  <div class="progress"><div style="width:${progress}%"></div></div>`;
}
function mascot(happy){
  const m = document.getElementById("mascot");
  if(m) m.textContent = happy ? ["🦁","🦢","🐘","🦘","🐔"][Math.floor(Math.random()*5)] : "🙈";
}
function confetti(){
  const colors=["#ffc83d","#ff4fa0","#3ecf8e","#3de8ff","#9d6bff"];
  for(let i=0;i<80;i++){
    const c=document.createElement("div");
    c.className="confetti";
    c.style.left=Math.random()*100+"vw";
    c.style.background=colors[i%colors.length];
    c.style.animationDuration=(2+Math.random()*2)+"s";
    c.style.animationDelay=(Math.random()*0.6)+"s";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),5200);
  }
}

/* =========================================================
   START & HIGHSCORE
========================================================= */
function showStart(){
  resetState();
  const scores = loadScores();
  screen.innerHTML = `
    <div class="center"><div class="spot">🎭</div></div>
    <p class="qtext center">Bereit für die Bühnen-Challenge?<br>Das wartet auf dich:</p>
    <div class="levels">
      <div class="level-chip"><span class="medal">🥉</span>
        <span>Level 1 – Backstage<small>Quizfragen · 10 P. pro Treffer</small></span>
        <span class="count">${N_MC} Fragen</span></div>
      <div class="level-chip"><span class="medal">🥈</span>
        <span>Level 2 – Generalprobe<small>Paare zuordnen · 15 P. pro Paar</small></span>
        <span class="count">${N_SETS} Runden</span></div>
      <div class="level-chip"><span class="medal">🥇</span>
        <span>Level 3 – Auftritt<small>Richtig schreiben! · 25 P. pro Wort</small></span>
        <span class="count">${N_WR} Wörter</span></div>
    </div>
    <p class="hint">🔥 Combo-Bonus: Ab 3 richtigen Antworten in Serie gibt's Extrapunkte. Mit 70 % schaltest du das nächste Level frei. Jede Runde mischt neue Fragen!</p>
    <label for="pname" style="font-weight:800;display:block;margin-top:14px">Dein Name:</label>
    <div class="write-row">
      <input type="text" id="pname" maxlength="14" placeholder="z. B. Luis" value="${esc(state.name||"")}">
      <button class="btn-primary" id="startBtn">Vorhang auf! 🎺</button>
    </div>
    ${scores.length?`
      <h3 style="font-family:'Baloo 2';margin-top:22px;color:var(--pink)">🏆 Highscore</h3>
      <table class="scores"><tr><th>#</th><th>Name</th><th>Datum</th><th style="text-align:right">Punkte</th></tr>
      ${scores.map((s,i)=>`<tr><td>${i+1}</td><td>${esc(s.n)}</td><td>${s.d}</td><td class="pts">${s.p}</td></tr>`).join("")}
      </table>`:""}
  `;
  const start = ()=>{
    state.name = document.getElementById("pname").value.trim() || "Spieler";
    startLevel1();
  };
  document.getElementById("startBtn").onclick = start;
  document.getElementById("pname").addEventListener("keydown",e=>{if(e.key==="Enter")start();});
}

/* =========================================================
   LEVEL 1 – MULTIPLE CHOICE
========================================================= */
function startLevel1(){
  state.mc = shuffle(MC_POOL).slice(0,N_MC); state.mcIdx=0; state.mcCorrect=0;
  showMC();
}
function showMC(){
  const i = state.mcIdx, item = state.mc[i];
  const opts = shuffle([item.a, ...item.w]);
  screen.innerHTML = hud(`🥉 Level 1 · ${i+1}/${N_MC}`, i/N_MC*100) + `
    <p class="qtext">${esc(item.q)}</p>
    ${opts.map(o=>`<button class="btn" data-v="${esc(o)}">${esc(o)}</button>`).join("")}
    <div class="feedback" id="fb"></div>
    <div class="center" style="margin-top:14px"><button class="btn-primary" id="next" style="display:none">Weiter ➜</button></div>`;
  screen.querySelectorAll(".btn").forEach(b=>{
    b.onclick = ()=>{
      const right = b.dataset.v === item.a;
      screen.querySelectorAll(".btn").forEach(x=>{
        x.classList.add(x.dataset.v===item.a ? "correct" : "dim");
        x.disabled = true;
      });
      if(!right) b.classList.replace("dim","wrong");
      const fb = document.getElementById("fb");
      if(right){
        bumpStreak(); state.mcCorrect++;
        const pts = 10 + comboBonus();
        state.score += pts;
        fb.className="feedback ok";
        fb.innerHTML = `<span class="big">Richtig! +${pts} P.</span>${state.streak>=3?" 🔥 Serien-Bonus!":""}`;
        mascot(true);
      }else{
        state.streak=0;
        fb.className="feedback no";
        fb.innerHTML = `<span class="big">Leider falsch.</span><br>${esc(item.e)}`;
        mascot(false);
      }
      const nx=document.getElementById("next");
      nx.style.display="inline-block"; nx.focus();
    };
  });
  document.getElementById("next").onclick = ()=>{
    state.mcIdx++;
    if(state.mcIdx < state.mc.length) showMC();
    else levelResult(1, state.mcCorrect, state.mc.length, startLevel1, startLevel2);
  };
}

/* =========================================================
   LEVEL 2 – ZUORDNUNG
========================================================= */
function startLevel2(){
  state.sets = shuffle(MATCH_SETS).slice(0,N_SETS);
  state.setIdx=0; state.pairTotal=0; state.pairFirstTry=0;
  showMatch();
}
function showMatch(){
  const set = state.sets[state.setIdx];
  const pairs = set.pairs;
  const left = shuffle(pairs.map((p,i)=>({t:p[0],id:i})));
  const right = shuffle(pairs.map((p,i)=>({t:p[1],id:i})));
  let sel = null, firstTry = {}, solved = 0;
  state.pairTotal += pairs.length;

  screen.innerHTML = hud(`🥈 Level 2 · Runde ${state.setIdx+1}/${N_SETS}`, state.setIdx/N_SETS*100) + `
    <p class="qtext">${esc(set.title)}</p>
    <div class="match-grid" id="grid">
      ${left.map((o,r)=>
        `<button class="btn L" data-id="${o.id}">${esc(o.t)}</button>`+
        `<button class="btn R" data-id="${right[r].id}">${esc(right[r].t)}</button>`
      ).join("")}
    </div>
    <div class="feedback" id="fb"></div>`;
  const grid = document.getElementById("grid");

  grid.querySelectorAll(".btn").forEach(b=>{
    b.onclick = ()=>{
      const isL = b.classList.contains("L");
      if(sel === null){
        grid.querySelectorAll(".btn").forEach(x=>x.classList.remove("selected"));
        b.classList.add("selected"); sel = b; return;
      }
      if(sel === b){ b.classList.remove("selected"); sel=null; return; }
      if(sel.classList.contains("L") === isL){
        sel.classList.remove("selected"); b.classList.add("selected"); sel=b; return;
      }
      const a = sel, fb = document.getElementById("fb");
      const id1 = a.dataset.id, id2 = b.dataset.id;
      if(id1 === id2){
        [a,b].forEach(x=>{x.classList.remove("selected");x.classList.add("correct");x.disabled=true;});
        solved++;
        if(!firstTry[id1]){
          state.pairFirstTry++; bumpStreak();
          const pts = 15 + comboBonus(); state.score += pts;
          fb.className="feedback ok"; fb.innerHTML=`<span class="big">Paar gefunden! +${pts} P.</span>${state.streak>=3?" 🔥":""}`;
        }else{
          state.score += 5;
          fb.className="feedback ok"; fb.innerHTML=`<span class="big">Jetzt stimmt's! +5 P.</span>`;
        }
        mascot(true);
        if(solved === pairs.length){
          setTimeout(()=>{
            state.setIdx++;
            if(state.setIdx < N_SETS) showMatch();
            else levelResult(2, state.pairFirstTry, state.pairTotal, startLevel2, startLevel3);
          }, 700);
        }
      }else{
        firstTry[id1]=true; firstTry[id2]=true;
        state.streak=0;
        [a,b].forEach(x=>x.classList.add("wrong"));
        setTimeout(()=>[a,b].forEach(x=>x.classList.remove("wrong","selected")),500);
        fb.className="feedback no"; fb.innerHTML=`<span class="big">Das passt nicht – probier's nochmal!</span>`;
        mascot(false);
      }
      sel = null;
    };
  });
}

/* =========================================================
   LEVEL 3 – SCHREIBEN
========================================================= */
function startLevel3(){
  state.wr = shuffle(WRITE_POOL).slice(0,N_WR); state.wrIdx=0; state.wrCorrect=0;
  showWrite();
}
function showWrite(){
  const i = state.wrIdx, item = state.wr[i];
  screen.innerHTML = hud(`🥇 Level 3 · ${i+1}/${N_WR}`, i/N_WR*100) + `
    <p class="qtext">${esc(item.q)}</p>
    <div class="write-row">
      <input type="text" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Hier schreiben …">
      <button class="btn-primary" id="check">Prüfen ✔</button>
    </div>
    <div class="charkeys">
      ${["ë","é","ä","ö","ü","ß","-"].map(c=>`<button type="button" data-c="${c}">${c}</button>`).join("")}
    </div>
    <p class="hint">💡 ${esc(item.hint)} &nbsp;·&nbsp; Sonderzeichen oben antippen!</p>
    <div class="feedback" id="fb"></div>
    <div class="center" style="margin-top:14px"><button class="btn-primary" id="next" style="display:none">Weiter ➜</button></div>`;
  const inp = document.getElementById("ans");
  inp.focus();
  screen.querySelectorAll(".charkeys button").forEach(b=>{
    b.onclick=()=>{ inp.value += b.dataset.c; inp.focus(); };
  });
  function evaluate(){
    const given = inp.value.trim().replace(/\s+/g," ");
    if(!given || inp.disabled) return;
    inp.disabled = true; document.getElementById("check").disabled = true;
    const fb = document.getElementById("fb");
    const exact = given.toLowerCase() === item.a.toLowerCase();
    const dist = levenshtein(given, item.a);
    if(exact){
      bumpStreak(); state.wrCorrect++;
      const pts = 25 + comboBonus(); state.score += pts;
      fb.className="feedback ok";
      fb.innerHTML = `<span class="big">Perfekt geschrieben! +${pts} P.</span>${state.streak>=3?" 🔥":""}<br>✍ <b>${esc(item.a)}</b>`;
      mascot(true);
    }else if(dist <= 2){
      state.streak = 0; state.score += 10;
      fb.className="feedback no";
      fb.innerHTML = `<span class="big">Fast! +10 P. – aber achte auf die Schreibweise:</span><br>
        Richtig: <b>${esc(item.a)}</b><br>Du hast geschrieben: ${esc(given)}`;
      mascot(false);
    }else{
      state.streak = 0;
      fb.className="feedback no";
      fb.innerHTML = `<span class="big">Leider nicht.</span><br>Richtig ist: <b>${esc(item.a)}</b>`;
      mascot(false);
    }
    const nx = document.getElementById("next");
    nx.style.display="inline-block"; nx.focus();
  }
  document.getElementById("check").onclick = evaluate;
  inp.addEventListener("keydown", e=>{ if(e.key==="Enter") evaluate(); });
  document.getElementById("next").onclick = ()=>{
    state.wrIdx++;
    if(state.wrIdx < state.wr.length) showWrite();
    else showFinal();
  };
}

/* =========================================================
   LEVEL-ERGEBNIS & FINALE
========================================================= */
function levelResult(level, correct, total, retryFn, nextFn){
  const passed = correct/total >= PASS;
  if(passed) confetti();
  const medals = {1:"🥉",2:"🥈",3:"🥇"};
  screen.innerHTML = `
    <div class="center">
      <div class="spot">${passed ? "🎉" : "😅"}</div>
      <p class="qtext">${passed
        ? `Level ${level} geschafft, ${esc(state.name)}! ${medals[level]} ${correct} von ${total} richtig!`
        : `Knapp daneben, ${esc(state.name)}: ${correct} von ${total}. Du brauchst mindestens ${Math.ceil(total*PASS)} – Revanche?!`}</p>
      <div class="stats-row">
        <div class="stat"><div class="v">${state.score}</div><div class="l">Punkte</div></div>
        <div class="stat"><div class="v">🔥 ${state.bestStreak}</div><div class="l">Beste Serie</div></div>
      </div>
      ${passed
        ? `<button class="btn-primary" id="go">Weiter zu Level ${level+1} ➜</button>`
        : `<button class="btn-primary" id="go">🔁 Level ${level} nochmal</button>`}
    </div>`;
  document.getElementById("go").onclick = passed ? nextFn : retryFn;
}

function trashTalk(name, score, oldBest){
  const n = esc(name);
  if(oldBest > 0 && score > oldBest)
    return `BOOM, ${n}! 💥 Neuer persönlicher Rekord – dein altes Ich (${oldBest} P.) wurde soeben von der Bühne gefegt. Jetzt verteidige deinen Thron! 👑`;
  if(score >= 600)
    return `Respekt, ${n} – fast Maestro-Niveau! 😎 Aber „fast“ zählt auf der Bühne nicht. Beim nächsten Mal will der Löwe Standing Ovations sehen! 🦁`;
  if(score >= 400)
    return `Solide Show, ${n}! Aber mal ehrlich: Der Elefant war schneller als deine Serie. 🐘💨 Nächster Durchlauf, +100 Punkte – traust du dich?`;
  if(score >= 200)
    return `Hmm, ${n} … das war eher Stimmen der Instrumente als großes Konzert. 🎻 Die Hühner gackern schon. Zeig ihnen beim nächsten Mal, wer hier der Star ist!`;
  return `Autsch, ${n} – der Vorhang fiel etwas früh. 😏 Aber hey: Jeder Maestro hat mal klein angefangen. Nochmal von vorn, und diesmal brüllst DU lauter als der Löwe! 🦁`;
}

function showFinal(){
  confetti();
  const oldBest = personalBest(state.name);
  addScore(state.name, state.score);
  const scores = loadScores();
  screen.innerHTML = `
    <div class="center">
      <div class="spot">🏆</div>
      <p class="qtext">Vorhang zu, Applaus für ${esc(state.name)}!</p>
      <div class="big-score">${state.score} Punkte</div>
      <div class="stats-row">
        <div class="stat"><div class="v">🔥 ${state.bestStreak}</div><div class="l">Längste Serie</div></div>
        <div class="stat"><div class="v">${state.mcCorrect}/${N_MC}</div><div class="l">Quiz</div></div>
        <div class="stat"><div class="v">${state.pairFirstTry}/${state.pairTotal}</div><div class="l">Paare (1. Versuch)</div></div>
        <div class="stat"><div class="v">${state.wrCorrect}/${N_WR}</div><div class="l">Perfekt geschrieben</div></div>
      </div>
      <div class="trash">${trashTalk(state.name, state.score, oldBest)}</div>
    </div>
    <h3 style="font-family:'Baloo 2';margin-top:18px;color:var(--pink)">🏆 Highscore</h3>
    <table class="scores"><tr><th>#</th><th>Name</th><th>Datum</th><th style="text-align:right">Punkte</th></tr>
    ${scores.map((s,i)=>`<tr class="${s.n===state.name&&s.p===state.score?"me":""}"><td>${i+1}</td><td>${esc(s.n)}</td><td>${s.d}</td><td class="pts">${s.p}</td></tr>`).join("")}
    </table>
    <div class="center" style="margin-top:20px">
      <button class="btn-primary" id="again">Revanche! 🎪</button>
    </div>
    <p class="hint center" style="margin-top:10px">Beim nächsten Durchlauf kommen andere Fragen aus dem Katalog!</p>`;
  document.getElementById("again").onclick = showStart;
}

showStart();
</script>
